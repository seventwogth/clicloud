name: Release candidate

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft GitHub Release after verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        # Only a binary built here may replace itself; one from a package manager
        # is that manager's to update, and is built without this.
        env:
          CLICLOUD_RELEASE: '1'
        run: cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Package and check executable
        run: python scripts/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: inputs.draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          gh release create "v$version" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --draft --target "$GITHUB_SHA" --title "clicloud v$version" \
            --notes-file "docs/releases/v$version.md"
