[package]
name = "clicloud"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SoundCloud search and playback in the terminal"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ratatui = "0.30"
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }
signal-hook = "0.3"
