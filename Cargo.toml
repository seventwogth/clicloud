[package]
name = "clicloud"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Music search and playback in the terminal"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ratatui = "0.30"
crossterm = "0.29"
fs2 = "0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "process"] }
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
